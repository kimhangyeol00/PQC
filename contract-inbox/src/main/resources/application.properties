spring.application.name=contract-inbox
server.port=${PORT:8000}
server.address=0.0.0.0
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/users/**,/organizations,/contracts/**,/inbox,/deliveries/**
workspace.directory=${DATA_DIR:data}
workspace.seed=${SEED_DEMO:true}
